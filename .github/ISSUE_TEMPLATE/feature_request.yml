name: Feature request
description: Suggest something N2O should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow where N2O falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like N2O to do?
    validations:
      required: true
